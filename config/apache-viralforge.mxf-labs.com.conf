<VirtualHost *:80>
    ServerName viralforge.mxf-labs.com

    ProxyRequests Off
    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:8081/ connectiontimeout=5 timeout=1200
    ProxyPassReverse / http://127.0.0.1:8081/

    ErrorLog ${APACHE_LOG_DIR}/viralforge-error.log
    CustomLog ${APACHE_LOG_DIR}/viralforge-access.log combined
</VirtualHost>
