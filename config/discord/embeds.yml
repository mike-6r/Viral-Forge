embeds:
  welcome:
    channel: welcome
    eyebrow: PLATFORM
    title: ViralForge
    description: "Review-first content operations for short-form brands."
    color: "#FF4F2E"
    asset: viralforge-welcome-hero.png
    hero_asset: true
    show_icon: true
    show_footer: true
    fields:
      - {name: Submit, value: "Add authorized source material."}
      - {name: Review, value: "Review clips and content packages before anything goes live."}
      - {name: Decide, value: "Make human publishing decisions from one workspace."}
    actions: [choose_role, how_it_works, open_support]
  standards:
    channel: welcome
    eyebrow: ACCESS + TRUST
    title: Start with the standards
    description: "Accept the community standards to unlock the member workspace."
    color: "#FF4F2E"
    show_footer: true
    fields:
      - {name: Keep work private, value: "Never post credentials, customer files, or private media in Discord."}
      - {name: Keep decisions human, value: "Use authorized sources and review content before anything goes live."}
    actions: [accept_rules]
  choose_roles:
    channel: access
    eyebrow: ACCESS
    title: Set Up Access
    description: "Choose how you use ViralForge so the server shows the right tools and notifications."
    color: "#5B8CFF"
    asset: viralforge-access-hero.png
    hero_asset: true
    show_footer: true
    fields:
      - {name: Account type, value: "Choose Creator, Brand, or Agency."}
      - {name: Notifications, value: "Choose only the updates you want."}
      - {name: Continue, value: "Finish onboarding when you are ready."}
    actions: []
  announcements:
    channel: announcements
    eyebrow: OFFICIAL UPDATES
    title: Platform Updates
    description: "Official product updates, maintenance notes, and release announcements."
    color: "#FF4F2E"
    asset: viralforge-announcements-hero.png
    hero_asset: true
    show_footer: false
    fields:
      - {name: Read-only by design, value: "Reply in Support or Community so official updates stay easy to scan."}
    actions: []
  product_overview:
    channel: product_overview
    eyebrow: PLATFORM
    title: One Content Workflow
    description: "Keep source discovery, clip preparation, review, publishing decisions, and performance learning connected."
    color: "#FF4F2E"
    asset: viralforge-workflow-hero.png
    hero_asset: true
    show_footer: false
    fields:
      - {name: Source, value: "Add authorized sources and videos."}
      - {name: Prepare + Review, value: "Inspect media and approve creative work."}
      - {name: Decide, value: "Ready for Decision never means automatic upload."}
    actions: [how_it_works, start_onboarding, view_pricing]
  how_it_works:
    channel: how_it_works
    eyebrow: WORKFLOW
    title: "Discover → Clip → Review → Decide"
    description: "A review-first path from authorized source material to a ready-for-decision content package."
    color: "#5B8CFF"
    asset: viralforge-workflow-hero.png
    hero_asset: true
    show_footer: false
    fields:
      - {name: Discover + Clip, value: "Find authorized sources and prepare strong moments."}
      - {name: Review, value: "Check creative output and context."}
      - {name: Decide, value: "A person chooses whether approved content goes live."}
    actions: [start_onboarding, view_pricing, open_support]
  pricing:
    channel: pricing_and_access
    eyebrow: PLANS
    title: Operating Levels
    description: "Choose the access level that fits your content operation."
    color: "#FF4F2E"
    asset: viralforge-plans-hero.png
    hero_asset: true
    show_footer: false
    fields:
      - {name: Creator + Professional, value: "Focused brands and growing review volume."}
      - {name: Agency, value: "Multiple brands and client workspaces."}
      - {name: Enterprise, value: "Custom workflows, integrations, and dedicated support."}
    actions: [request_access, talk_to_sales, view_pricing]
  workspace_guide:
    channel: workspace_guide
    eyebrow: WORKSPACES
    title: Brand Workspaces
    description: "Keep every brand's sources, review queue, publishing rules, and analytics organized."
    color: "#5B8CFF"
    asset: viralforge-workspace-hero.png
    hero_asset: true
    show_footer: false
    fields:
      - {name: Sources, value: "Keep approved sources in context."}
      - {name: Review Queue, value: "Make human decisions for each brand."}
      - {name: Analytics, value: "Keep rules and learning brand-scoped."}
    actions: [start_onboarding, open_support]
  review_and_publish:
    channel: review_and_publish
    eyebrow: REVIEW
    title: Review Before Publishing
    description: "ViralForge prepares the work. Operators make the decision."
    color: "#FF4F2E"
    asset: viralforge-review-hero.png
    hero_asset: true
    show_footer: false
    fields:
      - {name: Creative Review, value: "Approve or reject clips and content packages."}
      - {name: Context Check, value: "Review attribution, warnings, and source acceptance."}
      - {name: Publishing Decision, value: "Ready for Decision still needs human action."}
    actions: [open_review_queue, how_it_works, open_support]
  analytics:
    channel: analytics
    eyebrow: ANALYTICS
    title: Learn What Performs
    description: "Turn publishing results into practical feedback for future review decisions."
    color: "#5B8CFF"
    asset: viralforge-analytics-hero.png
    hero_asset: true
    show_footer: false
    fields:
      - {name: Signals, value: "Use available performance signals."}
      - {name: Patterns, value: "Compare hooks, pacing, topics, and formats."}
      - {name: Recommendations, value: "People remain in control of decisions."}
    actions: [start_onboarding, open_support]
  onboarding:
    channel: onboarding
    eyebrow: ONBOARDING
    title: Configure Your First Workspace
    description: "Start with one brand, one approved source, and one review path."
    color: "#FF4F2E"
    show_footer: true
    fields:
      - {name: 1. Access, value: "Choose your account type and notifications."}
      - {name: 2. Workspace, value: "Confirm your brand and operating context."}
      - {name: 3. Source, value: "Add approved source material."}
      - {name: 4. Review, value: "Review your first clip and post details before a publishing decision."}
    actions: [start_onboarding, open_support]
  support:
    channel: support
    eyebrow: SUPPORT
    title: Open the Right Request
    description: "Get private help for access, workspace setup, sources, publishing, plans, bugs, or custom workflows."
    color: "#5B8CFF"
    asset: viralforge-support-hero.png
    hero_asset: true
    show_footer: false
    fields:
      - {name: Keep it secure, value: "Never paste credentials, passwords, private media, or tokens in public channels."}
    actions: [open_ticket]
  feature_requests:
    channel: feature_requests
    eyebrow: PRODUCT FEEDBACK
    title: Improve the Workflow
    description: "Create one focused post: explain the problem, who needs it, and the workflow it would improve."
    color: "#FF4F2E"
    show_footer: true
    fields:
      - {name: Use tags, value: "Feature, Integration, Workflow, Bug, Quality of Life, In Review, or Planned."}
    actions: [submit_feature]
  ops_center:
    channel: ops_center
    eyebrow: OPERATIONS
    title: Operations Center
    description: "Monitor active brands, review queues, ready-for-decision items, support activity, and workflow health."
    color: "#FF4F2E"
    asset: viralforge-ops-center-hero.png
    hero_asset: true
    show_footer: false
    fields:
      - {name: Needs Attention, value: "Start with blocked work and escalated support."}
      - {name: Review Queue, value: "Open the next creative decision for the active brand."}
      - {name: Ready for Decision, value: "Publishing always requires a human decision."}
    actions: [open_review_queue, ready_to_post, add_video, open_tickets, refresh]
  ready_to_post:
    channel: ready_to_post
    eyebrow: PUBLISHING DECISION
    title: Ready for Decision
    description: "Approved content is waiting for a human publishing decision."
    color: "#F5A524"
    asset: viralforge-ready-to-post-hero.png
    hero_asset: true
    show_footer: false
    fields:
      - {name: Human decision required, value: "Ready for Decision does not mean automatic upload."}
      - {name: Before proceeding, value: "Confirm source, rights, moderation, clip, package, and destination."}
    actions: [ready_to_post, open_review_queue, return_to_ops_center]
