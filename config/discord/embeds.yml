embeds:
  welcome:
    channel: welcome
    eyebrow: PLATFORM
    title: ViralForge
    description: "**PLATFORM**\nReview-first content operations for short-form brands."
    color: "#FF4F2E"
    asset: viralforge-welcome-hero.png
    hero_asset: true
    layout: hero_then_content
    show_icon: false
    show_footer: false
    fields:
      - {name: Submit, value: "Authorized media"}
      - {name: Review, value: "Human approval"}
      - {name: Decide, value: "No auto-upload"}
    actions: [choose_role, how_it_works, open_support]
  standards:
    channel: welcome
    eyebrow: ACCESS + TRUST
    title: Start with the standards
    description: "Accept the standards to unlock the member workspace."
    color: "#FF4F2E"
    show_footer: false
    fields:
      - {name: Private, value: "Keep credentials out of Discord", inline: true}
      - {name: Approved, value: "Use authorized sources only", inline: true}
      - {name: Human-led, value: "Review before posting", inline: true}
    actions: [accept_rules]
  choose_roles:
    channel: access
    eyebrow: ACCESS
    title: Set Up Access
    description: "**ACCESS**\nChoose your account type and notifications."
    color: "#FF4F2E"
    asset: viralforge-access-hero.png
    hero_asset: true
    layout: hero_then_content
    show_footer: false
    fields:
      - {name: Account, value: "Creator / Brand / Agency"}
      - {name: Alerts, value: "Optional"}
      - {name: Workspace, value: "Continue next"}
    actions: []
  announcements:
    channel: announcements
    eyebrow: OFFICIAL UPDATES
    title: Platform Updates
    description: "Official product updates and release notes."
    color: "#FF4F2E"
    asset: viralforge-announcements-hero.png
    hero_asset: false
    layout: compact
    show_footer: false
    fields:
      - {name: Updates, value: "Release notes"}
    actions: []
  product_overview:
    channel: product_overview
    eyebrow: PLATFORM
    title: One Content Workflow
    description: "**PLATFORM**\nSource, prepare, review, and decide from one organized workspace."
    color: "#FF4F2E"
    asset: viralforge-workflow-hero.png
    hero_asset: true
    layout: hero_then_content
    show_footer: false
    fields:
      - {name: Source, value: "Authorized media"}
      - {name: Review, value: "Human approval"}
      - {name: Decision, value: "No auto-upload"}
    actions: [start_onboarding, how_it_works, view_pricing]
  how_it_works:
    channel: how_it_works
    eyebrow: WORKFLOW
    title: "Discover → Clip → Review → Decide"
    description: "**WORKFLOW**\nA review-first path from source material to a ready-for-decision package."
    color: "#FF4F2E"
    asset: viralforge-workflow-hero.png
    hero_asset: true
    layout: hero_then_content
    show_footer: false
    fields:
      - {name: Discover, value: "Find sources"}
      - {name: Clip, value: "Prepare moments"}
      - {name: Decide, value: "Human choice"}
    actions: [start_onboarding, view_pricing, open_support]
  pricing:
    channel: pricing_and_access
    eyebrow: PLANS
    title: Operating Levels
    description: "**PLANS**\nChoose the access level that fits your content operation."
    color: "#FF4F2E"
    asset: viralforge-plans-hero.png
    hero_asset: true
    layout: hero_then_content
    show_footer: false
    fields:
      - {name: Creator, value: "One brand"}
      - {name: Agency, value: "Client workspaces"}
      - {name: Enterprise, value: "Custom support"}
    actions: [request_access, talk_to_sales, view_pricing]
  workspace_guide:
    channel: workspace_guide
    eyebrow: WORKSPACE
    title: Brand Workspaces
    description: "**WORKSPACE**\nKeep each brand's content operation organized."
    color: "#FF4F2E"
    asset: viralforge-workspace-hero.png
    hero_asset: true
    layout: hero_then_content
    show_footer: false
    fields:
      - {name: Sources, value: "Approved media"}
      - {name: Queue, value: "Review work"}
      - {name: Learning, value: "Performance signals"}
    actions: [start_onboarding, open_support]
  review_and_publish:
    channel: review_and_publish
    eyebrow: REVIEW
    title: Review Before Publishing
    description: "**REVIEW-FIRST**\nReview clips and context before any publishing decision."
    color: "#FF4F2E"
    asset: viralforge-review-hero.png
    hero_asset: true
    layout: hero_then_content
    show_footer: false
    fields:
      - {name: Clips, value: "Creative review"}
      - {name: Context, value: "Rights check"}
      - {name: Decision, value: "Human approval"}
    actions: [open_review_queue, how_it_works, open_support]
  analytics:
    channel: analytics
    eyebrow: ANALYTICS
    title: Learn What Performs
    description: "**ANALYTICS**\nLearn what performs and use the signals to guide future review."
    color: "#FF4F2E"
    asset: viralforge-analytics-hero.png
    hero_asset: true
    layout: hero_then_content
    show_footer: false
    fields:
      - {name: Signals, value: "Views / retention"}
      - {name: Patterns, value: "Hooks / pacing"}
      - {name: Control, value: "Human decisions"}
    actions: [view_workspace, open_support]
  onboarding:
    channel: onboarding
    eyebrow: ONBOARDING
    title: Configure Your First Workspace
    description: "Start with one brand, one approved source, and one review path."
    color: "#FF4F2E"
    show_footer: true
    fields:
      - {name: 1. Access, value: "Choose your account type and notifications."}
      - {name: 2. Workspace, value: "Confirm your brand and operating context."}
      - {name: 3. Source, value: "Add approved source material."}
      - {name: 4. Review, value: "Review your first clip and post details before a publishing decision."}
    actions: [start_onboarding, open_support]
  support:
    channel: support
    eyebrow: SUPPORT
    title: Open the Right Request
    description: "**SUPPORT**\nGet private help from the correct team."
    color: "#5B8CFF"
    asset: viralforge-support-hero.png
    hero_asset: true
    layout: hero_then_content
    show_footer: false
    fields:
      - {name: Access, value: "Roles / plans"}
      - {name: Workflow, value: "Sources / publishing"}
      - {name: Issues, value: "Bugs / fixes"}
    actions: [open_ticket, view_help]
  feature_requests:
    channel: feature_requests
    eyebrow: PRODUCT FEEDBACK
    title: Improve the Workflow
    description: "Create one focused post: explain the problem, who needs it, and the workflow it would improve."
    color: "#FF4F2E"
    show_footer: true
    fields:
      - {name: Use tags, value: "Feature, Integration, Workflow, Bug, Quality of Life, In Review, or Planned."}
    actions: [submit_feature]
  ops_center:
    channel: ops_center
    eyebrow: OPERATIONS
    title: Operations Center
    description: "**OPERATIONS**\nSee active work, review queues, and items ready for decision."
    color: "#FF4F2E"
    asset: viralforge-ops-center-hero.png
    hero_asset: true
    layout: hero_then_content
    show_footer: false
    fields:
      - {name: Attention, value: "Needs review"}
      - {name: Queue, value: "Ready items"}
      - {name: Support, value: "Open tickets"}
    actions: [open_review_queue, ready_to_post, add_video, open_tickets, refresh]
  ready_to_post:
    channel: ready_to_post
    eyebrow: PUBLISHING DECISION
    title: Ready for Decision
    description: "**DECISION**\nApproved content is waiting for a human publishing decision."
    color: "#FF4F2E"
    asset: viralforge-ready-to-post-hero.png
    hero_asset: false
    layout: compact
    show_footer: false
    fields:
      - {name: Approved, value: "Review complete"}
      - {name: Waiting, value: "Human decision"}
      - {name: Safety, value: "No auto-upload"}
    actions: [view_ready_queue, review_package, return_to_ops_center]
