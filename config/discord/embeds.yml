embeds:
  welcome:
    channel: start_here
    eyebrow: VIRALFORGE
    title: ViralForge
    description: "Content operations for short-form brands. Discover strong source videos, prepare clips, review before publishing, and learn from performance in one guided workspace."
    color: "#FF4D44"
    asset: welcome-command-center.png
    hero_asset: true
    show_icon: true
    show_footer: true
    fields:
      - {name: For brands, value: "Keep sources, review decisions, publishing rules, and performance feedback organized."}
      - {name: For operators, value: "Move approved content forward without losing the source context."}
      - {name: Start here, value: "Accept the standards, set up access, then choose your first workspace goal."}
    actions: [choose_role, how_it_works, view_pricing]
  standards:
    channel: start_here
    eyebrow: ACCESS + TRUST
    title: Community standards
    description: "A short agreement that keeps access, customer work, and community feedback safe."
    color: "#FF4D44"
    fields:
      - {name: Keep it private, value: "Never post credentials, customer files, or private media in Discord."}
      - {name: Keep it responsible, value: "Use approved sources and leave specific, respectful feedback."}
    actions: [accept_rules, terms, privacy]
  choose_roles:
    channel: choose_your_role
    eyebrow: ACCESS SETUP
    title: Set Up Your Access
    description: "Choose how you use ViralForge so the workspace shows the right tools. This is a profile choice, not permission escalation."
    color: "#3BA3FF"
    fields:
      - {name: Account type, value: "Creator, Brand, or Agency. Operator and Support access are assigned by staff only."}
      - {name: Notifications, value: "Choose Product Updates, Workflow Alerts, Creator Tips, Case Studies, or Community Events."}
      - {name: Next step, value: "Continue onboarding when your profile is saved, or open a private request for help."}
    actions: []
  product_overview:
    channel: product_overview
    eyebrow: PLATFORM
    title: One clear content workflow
    description: "A calm, review-first system for finding source material, preparing clips, and learning what performs."
    color: "#FF4D44"
    fields:
      - {name: Control, value: "Important decisions stay human-approved."}
      - {name: Scale, value: "Run one brand or many without mixing context."}
    actions: [how_it_works, start_onboarding]
  how_it_works:
    channel: how_it_works
    eyebrow: WORKFLOW
    title: Discover. Clip. Review. Publish. Learn.
    description: "A review-first path from an approved source to a measured short-form post."
    color: "#3BA3FF"
    fields:
      - {name: Discover, value: "Choose approved source material and identify promising moments."}
      - {name: Review, value: "Check clips, source context, captions, and destination before anything goes live."}
      - {name: Learn, value: "Use available performance signals to improve the next review."}
    actions: []
  pricing:
    channel: pricing_and_access
    eyebrow: PLANS
    title: Plans for the way you operate
    description: "Choose the level of workspace support that fits your content operation. Access and billing are handled privately."
    color: "#FF4D44"
    fields:
      - {name: Creator, value: "Best for: one focused content brand. Includes: a guided workspace and review flow. Next: request access."}
      - {name: Professional, value: "Best for: teams with more review volume. Includes: team workflows and broader operating controls. Next: talk to us."}
      - {name: Agency, value: "Best for: multiple brands or client workspaces. Includes: multi-brand coordination. Next: talk to us."}
      - {name: Enterprise, value: "Best for: custom workflows and dedicated support. Includes: tailored operating requirements. Next: open a private request."}
    actions: [request_access, talk_to_sales]
  workspace_guide:
    channel: workspace_guide
    eyebrow: WORKSPACES
    title: Keep every brand in context
    description: "Each brand gets its own workspace so sources, review decisions, publishing rules, analytics, and team access stay clean."
    color: "#3BA3FF"
    fields:
      - {name: Sources, value: "Keep approved source identities and source quality in the right brand context."}
      - {name: Review + rules, value: "Keep clip decisions and publishing controls clear for each workspace."}
      - {name: Analytics + team access, value: "Learn from performance without mixing team access or results."}
    actions: [start_onboarding]
  review_queue:
    channel: review_queue
    eyebrow: REVIEW + PUBLISH
    title: Review before anything goes live
    description: "ViralForge prepares the work; a person decides what moves forward."
    color: "#FF4D44"
    fields:
      - {name: Review clips, value: "Check the moment, context, framing, and source acceptance."}
      - {name: Check post details, value: "Review caption, metadata, rights, moderation, and the destination account."}
      - {name: Approve or reject, value: "Choose what proceeds. Publishing and scheduling always require an explicit human decision."}
    actions: [start_onboarding, open_support]
  analytics:
    channel: analytics
    eyebrow: FEEDBACK LOOP
    title: Learn from what performs
    description: "ViralForge turns publishing results into practical feedback for future clips."
    color: "#3BA3FF"
    fields:
      - {name: Signals, value: "Views, retention, engagement, follower growth, and other metrics only when the platform provides them."}
      - {name: Learnings, value: "Compare hooks, pacing, captions, topics, source quality, and posting time."}
      - {name: Decisions, value: "Recommendations inform your next review; settings never change silently."}
    actions: [start_onboarding]
  onboarding:
    channel: onboarding
    eyebrow: ONBOARDING
    title: Configure your first workspace
    description: "Follow the checklist once, then use the workspace with a clear review-first routine."
    color: "#FF4D44"
    fields:
      - {name: 1. Set up access, value: "Choose your account type and notifications."}
      - {name: 2. Confirm your workspace, value: "Tell us the brand or team context you need."}
      - {name: 3. Add approved sources, value: "Start with sources you are permitted to process."}
      - {name: 4. Review your first post, value: "Approve the first clip and post details before any publish decision."}
    actions: [start_onboarding, open_support]
  support:
    channel: support
    eyebrow: SUPPORT
    title: Get Support
    description: "Open a private request for workspace access, sources, publishing, plans, bugs, or custom workflows."
    color: "#3BA3FF"
    fields:
      - {name: Choose a topic, value: "Account / Access, Workspace Setup, Source or Video Issue, Publishing Issue, Billing / Plan, Bug Report, or Custom Workflow."}
      - {name: Keep it safe, value: "Never paste passwords, credentials, or private media in a public channel."}
    actions: [open_support]
  feature_requests:
    channel: feature_requests
    eyebrow: PRODUCT FEEDBACK
    title: Improve the workflow
    description: "Create one focused forum post. Explain the problem before proposing a solution."
    color: "#FF4D44"
    fields:
      - {name: Use tags, value: "Feature, Integration, Workflow, Bug, Quality of Life, In Review, or Planned."}
    actions: [submit_feature]
  team_dashboard:
    channel: team_dashboard
    eyebrow: OPERATIONS
    title: Operations Center
    description: "Monitor active brands, review queues, content readiness, publishing issues, and support activity."
    color: "#FF4D44"
    fields:
      - {name: Needs attention, value: "Start with failed jobs, holds, and escalated support requests."}
      - {name: Active workspaces, value: "Check brands with current source, review, or publishing activity."}
      - {name: Review + publishing, value: "Open customer review for clips and ticket logs for support activity."}
      - {name: Next action, value: "Choose one queue below; diagnostics remain in staff-only tools."}
    actions: [view_tickets, review_customers, refresh, open_logs]
