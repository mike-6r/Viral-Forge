embeds:
  welcome:
    channel: start_here
    eyebrow: VIRALFORGE
    title: Content operations for short-form brands
    description: "Discover approved sources, prepare clips, review content, publish with control, and learn what performs."
    color: "#FF4D44"
    asset: welcome-command-center.png
    fields:
      - {name: How it works, value: "Discover -> Clip -> Review -> Publish -> Track"}
      - {name: Best for, value: "Creators, agencies, media companies, and businesses."}
      - {name: Start here, value: "Choose a role, then begin onboarding when ready."}
    actions: [choose_role, start_onboarding, view_platform, open_support]
  standards:
    channel: start_here
    eyebrow: ACCESS + TRUST
    title: Community standards
    description: "Protect private access, use approved sources, and keep feedback constructive."
    color: "#FF4D44"
    asset: platform-standards.png
    fields:
      - {name: Private by default, value: "Never post credentials, customer files, or private media."}
      - {name: Human controlled, value: "Access and publishing decisions remain reviewed."}
    actions: [accept_rules, terms, privacy]
  choose_roles:
    channel: choose_your_role
    eyebrow: ACCESS SETUP
    title: Choose your ViralForge experience
    description: "Select an account type and only the notifications you want. Workspace access is assigned after onboarding."
    color: "#3BA3FF"
    fields:
      - {name: Account type, value: "Creator, Agency, Media Company, Business, or Trial User."}
      - {name: Workspace access, value: "Workspace Owner, Reviewer, Publisher, and Analytics Viewer are staff-assigned."}
      - {name: Notifications, value: "Opt in only to updates that help you."}
    actions: []
  product_overview:
    channel: product_overview
    eyebrow: PLATFORM
    title: One clear content workflow
    description: "Keep source discovery, clip preparation, review, and performance learning in one organized workspace."
    color: "#FF4D44"
    asset: welcome-command-center.png
    fields:
      - {name: Control, value: "Operators approve each important step."}
      - {name: Scale, value: "Run one brand or many without mixing context."}
    actions: [how_it_works, start_onboarding]
  how_it_works:
    channel: how_it_works
    eyebrow: WORKFLOW
    title: Discover. Analyze. Create. Review. Publish. Track.
    description: "A review-first path from an approved source to a measured short-form post."
    color: "#3BA3FF"
    asset: how-it-works.png
    fields:
      - {name: Discover + analyze, value: "Surface approved source material and strong moments."}
      - {name: Create + review, value: "Prepare clips and metadata, then make a human decision."}
      - {name: Publish + track, value: "Use explicit approval and learn from available metrics."}
    actions: []
  pricing:
    channel: pricing_and_access
    eyebrow: PLANS
    title: Access that fits the operation
    description: "Discord does not collect billing information. Access is reviewed and provisioned by the ViralForge team."
    color: "#FF4D44"
    asset: pricing-access.png
    fields:
      - {name: Creator, value: "Focused content operation."}
      - {name: Professional + Agency, value: "Team review and multi-brand workflows."}
      - {name: Enterprise, value: "Custom operating requirements."}
    actions: [request_access, talk_to_sales]
  workspace_guide:
    channel: workspace_guide
    eyebrow: WORKSPACES
    title: Keep every brand in context
    description: "Each workspace holds its sources, rules, review queue, publishing settings, analytics, and permissions."
    color: "#3BA3FF"
    asset: workspace-guide.png
    fields:
      - {name: Separate by design, value: "Brand context and access remain isolated."}
      - {name: Start small, value: "Begin with one approved source and one review path."}
    actions: [start_onboarding]
  review_queue:
    channel: review_queue
    eyebrow: REVIEW + PUBLISH
    title: Prepare, approve, then publish
    description: "Clips move through caption and metadata preparation, review, approval, scheduling, and explicit publishing."
    color: "#FF4D44"
    asset: review-queue.png
    fields:
      - {name: Before approval, value: "Check source context, rights, copy, framing, and destination."}
      - {name: No silent publishing, value: "A human chooses every publish or schedule action."}
    actions: [open_support]
  analytics:
    channel: analytics
    eyebrow: FEEDBACK LOOP
    title: Learn from what performs
    description: "Use available platform metrics to understand hooks, topics, formats, and posting patterns."
    color: "#3BA3FF"
    fields:
      - {name: Signals, value: "Views, watch time, retention, and engagement when available."}
      - {name: Recommendations, value: "Performance informs review; it never changes settings silently."}
    actions: []
  onboarding:
    channel: onboarding
    eyebrow: ONBOARDING
    title: Configure your first workspace
    description: "Choose your path, verify access with the team, add approved sources, and set brand review rules."
    color: "#FF4D44"
    fields:
      - {name: First step, value: "Select your account type and goal."}
      - {name: Next, value: "Support verifies workspace access when needed."}
    actions: [start_onboarding]
  support:
    channel: support
    eyebrow: SUPPORT
    title: Open a private request
    description: "Get help with workspace setup, sources, publishing, account access, plans, bugs, or custom workflows."
    color: "#3BA3FF"
    fields:
      - {name: Keep it safe, value: "Do not paste credentials or private source media in Discord."}
    actions: [open_support]
  feature_requests:
    channel: feature_requests
    eyebrow: PRODUCT FEEDBACK
    title: Improve the workflow
    description: "Create one focused forum post. Explain the problem before proposing a solution."
    color: "#FF4D44"
    fields:
      - {name: Use tags, value: "Feature, Integration, Workflow, Bug, Quality of Life, In Review, or Planned."}
    actions: [submit_feature]
  team_dashboard:
    channel: team_dashboard
    eyebrow: OPERATIONS
    title: Team dashboard
    description: "A compact staff overview for what needs attention now."
    color: "#FF4D44"
    fields:
      - {name: Requests, value: "Tickets and onboarding."}
      - {name: Content pipeline, value: "Reviews and holds."}
      - {name: Customer activity, value: "Access and workspace movement."}
      - {name: System attention, value: "Alerts and failed jobs."}
    actions: [view_tickets, review_customers, refresh, open_logs]
