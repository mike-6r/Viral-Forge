embeds:
  welcome:
    channel: welcome
    eyebrow: PLATFORM
    title: ViralForge
    description: "Review-first content operations for short-form brands."
    color: "#FF4F2E"
    asset: viralforge-welcome-v2.png
    hero_asset: true
    show_icon: true
    show_footer: true
    fields:
      - {name: Discover, value: "Find or add approved source material."}
      - {name: Review, value: "Approve clips, metadata, context, and publishing readiness."}
      - {name: Decide, value: "Approved work waits for an explicit human publishing decision."}
    actions: [choose_role, how_it_works, open_support]
  standards:
    channel: welcome
    eyebrow: ACCESS + TRUST
    title: Start with the standards
    description: "Accept the community standards to unlock the member workspace."
    color: "#FF4F2E"
    show_footer: true
    fields:
      - {name: Keep work private, value: "Never post credentials, customer files, or private media in Discord."}
      - {name: Keep decisions human, value: "Use authorized sources and review content before anything goes live."}
    actions: [accept_rules]
  choose_roles:
    channel: access
    eyebrow: ACCESS
    title: Set Up Your Access
    description: "Choose your account type and the updates you want. Profile choices never grant operator authority."
    color: "#5B8CFF"
    show_footer: true
    fields:
      - {name: Step 1, value: "Choose Creator, Brand, or Agency."}
      - {name: Step 2, value: "Choose Product Updates, Workflow Alerts, Creator Tips, Case Studies, or Community Events."}
      - {name: Step 3, value: "Continue onboarding or open a private support request."}
    actions: []
  announcements:
    channel: announcements
    eyebrow: OFFICIAL UPDATES
    title: Announcements
    description: "Platform changes, maintenance, release notes, and important operator notices appear here."
    color: "#FF4F2E"
    show_footer: true
    fields:
      - {name: Read-only by design, value: "Reply in Support or Community so official updates stay easy to scan."}
    actions: []
  product_overview:
    channel: product_overview
    eyebrow: PLATFORM
    title: One Clear Content Workflow
    description: "Keep source discovery, clip preparation, review, publishing decisions, and performance learning in one organized workspace."
    color: "#FF4F2E"
    show_footer: true
    fields:
      - {name: Source, value: "Add approved sources or manual video URLs."}
      - {name: Prepare, value: "Inspect and analyze authorized media."}
      - {name: Review, value: "Approve creative work before any publishing decision."}
      - {name: Decide, value: "Ready-to-post never means automatic upload."}
    actions: [how_it_works, start_onboarding, view_pricing]
  how_it_works:
    channel: how_it_works
    eyebrow: WORKFLOW
    title: From Source Video to Approved Post
    description: "A review-first path from authorized material to a ready-to-post content package."
    color: "#5B8CFF"
    show_footer: true
    fields:
      - {name: Discover + Analyze, value: "Find a source and identify strong moments with context."}
      - {name: Clip + Review, value: "Prepare clips and review the creative output."}
      - {name: Publish decision, value: "A person chooses whether and when approved content goes live."}
    actions: [start_onboarding, view_pricing, open_support]
  pricing:
    channel: pricing_and_access
    eyebrow: PLANS
    title: Choose the Right Operating Level
    description: "Access is reviewed privately so every workspace is configured for the right content operation."
    color: "#FF4F2E"
    show_footer: true
    fields:
      - {name: Creator, value: "One focused content brand."}
      - {name: Professional, value: "A team managing more review volume."}
      - {name: Agency, value: "Multiple brands and client workspaces."}
      - {name: Enterprise, value: "Custom workflows, integrations, and dedicated support."}
    actions: [request_access, talk_to_sales]
  workspace_guide:
    channel: workspace_guide
    eyebrow: WORKSPACES
    title: Keep Every Brand in Context
    description: "Sources, reviews, publishing rules, analytics, and team access stay organized by brand."
    color: "#5B8CFF"
    show_footer: true
    fields:
      - {name: Sources, value: "Approved channels, videos, feeds, websites, and uploads."}
      - {name: Review queue, value: "Human decisions for sources, clips, and content packages."}
      - {name: Rules + analytics, value: "Publishing requirements and performance feedback stay brand-scoped."}
    actions: [start_onboarding, open_support]
  review_and_publish:
    channel: review_and_publish
    eyebrow: REVIEW
    title: Approve What Matters Before Anything Goes Live
    description: "ViralForge prepares content. Operators make the final decisions."
    color: "#FF4F2E"
    show_footer: true
    fields:
      - {name: Creative review, value: "Approve or reject clips and content packages."}
      - {name: Rights + context, value: "Review attribution, warnings, source acceptance, and publishing readiness."}
      - {name: Publishing decision, value: "READY_TO_POST means ready for human action, not automatic upload."}
    actions: [start_onboarding, how_it_works, open_support]
  analytics:
    channel: analytics
    eyebrow: ANALYTICS
    title: Learn What Performs
    description: "Turn official platform results and operator feedback into practical recommendations."
    color: "#5B8CFF"
    show_footer: true
    fields:
      - {name: Signals, value: "Views, retention, engagement, follower growth, and other available metrics."}
      - {name: Learnings, value: "Compare hooks, pacing, captions, topics, formats, and source quality."}
      - {name: Decisions, value: "Recommendations support people; settings never change silently."}
    actions: [start_onboarding, open_support]
  onboarding:
    channel: onboarding
    eyebrow: ONBOARDING
    title: Configure Your First Workspace
    description: "Start with one brand, one approved source, and one review path."
    color: "#FF4F2E"
    show_footer: true
    fields:
      - {name: 1. Access, value: "Choose your account type and notifications."}
      - {name: 2. Workspace, value: "Confirm your brand and operating context."}
      - {name: 3. Source, value: "Add approved source material."}
      - {name: 4. Review, value: "Review your first clip and post details before a publishing decision."}
    actions: [start_onboarding, open_support]
  support:
    channel: support
    eyebrow: SUPPORT
    title: Get Support
    description: "Open a private request for access, workspace setup, source issues, publishing questions, plans, bugs, or custom workflows."
    color: "#5B8CFF"
    show_footer: true
    fields:
      - {name: Keep it secure, value: "Never paste credentials, passwords, private media, or source files in public channels."}
    actions: [open_support]
  feature_requests:
    channel: feature_requests
    eyebrow: PRODUCT FEEDBACK
    title: Improve the Workflow
    description: "Create one focused post: explain the problem, who needs it, and the workflow it would improve."
    color: "#FF4F2E"
    show_footer: true
    fields:
      - {name: Use tags, value: "Feature, Integration, Workflow, Bug, Quality of Life, In Review, or Planned."}
    actions: [submit_feature]
  ops_center:
    channel: ops_center
    eyebrow: OPERATIONS
    title: Operations Center
    description: "Monitor active brands, review work, ready-to-post items, support activity, and automation health."
    color: "#FF4F2E"
    show_footer: true
    fields:
      - {name: Needs attention, value: "Start with failed jobs, blocked work, and escalated support."}
      - {name: Review queue, value: "Open the next creative decision for the active brand."}
      - {name: Ready to post, value: "Queue items still require an explicit human publishing decision."}
      - {name: Next action, value: "Use the controls below; diagnostics stay in staff-only tools."}
    actions: [open_review_queue, ready_to_post, add_video, open_tickets, refresh]
  ready_to_post:
    channel: ready_to_post
    eyebrow: PUBLISHING DECISION
    title: Ready to Post
    description: "Approved content waits here for an explicit destination, publish, or schedule decision."
    color: "#F5A524"
    show_footer: true
    fields:
      - {name: No silent publishing, value: "This queue never uploads content by itself."}
      - {name: Before proceeding, value: "Confirm source, rights, moderation, clip, package, and destination requirements."}
    actions: [open_review_queue, open_support]
